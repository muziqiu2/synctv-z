<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- synctv-z 专属图标：双屏同帧（双屏错位重叠 = 多端同步，朱红播放键 = 同一时刻同一帧） -->
  <!-- 纸色底 -->
  <rect width="96" height="96" rx="22" fill="#FBF7EE"/>
  <!-- 后屏 -->
  <rect x="34" y="13" width="46" height="46" rx="12" fill="none" stroke="#2F2C26" stroke-width="6"/>
  <!-- 前屏 -->
  <rect x="12" y="28" width="52" height="52" rx="12" fill="#FBF7EE" stroke="#2F2C26" stroke-width="6"/>
  <!-- 播放键（朱红，圆角） -->
  <path d="M33 44 L55 54 L33 64 Z" fill="#D6482F" stroke="#D6482F" stroke-width="6" stroke-linejoin="round"/>
</svg>
